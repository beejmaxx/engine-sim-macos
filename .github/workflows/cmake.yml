name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-mac:
    name: Native Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          brew install cmake ninja bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Check Metal compiler
        run: |
          xcodebuild -version
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: Configure
        run: cmake --preset macos-arm64-package -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build --preset macos-arm64-package --parallel 3
      - name: Test core, catalog, scripts, and dummy audio
        run: ctest --test-dir build/macos-arm64-package --output-on-failure
      - name: Install and verify bundle
        run: |
          cmake --install build/macos-arm64-package --prefix "$PWD/dist"
          codesign --verify --deep --strict dist/engine-sim-sound.app
          dist/engine-sim-sound.app/Contents/MacOS/engine-sim-sound --list-engines
          ditto -c -k --sequesterRsrc --keepParent dist/engine-sim-sound.app engine-sim-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: engine-sim-macos-arm64
          path: engine-sim-macos-arm64.zip
          if-no-files-found: error

  portable-core:
    name: Portable core (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-x86_64
          - os: windows-2022
            preset: windows-x86_64-ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DENGINE_SIM_BUILD_DESKTOP=OFF -DENGINE_SIM_BUILD_SCRIPTING=OFF
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 3
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
